name: ServeRest API Tests

on:
  push:
    branches: main
  pull_request:
    branches: main
  workflow_dispatch: # Permite execução manual
  schedule:
    - cron: '0 8 * * *' # Executa diariamente às 8h UTC

jobs:
  api-tests:
    name: Run API Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman and Reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Run Postman Collection
        run: |
          newman run ServeRest-Collection.postman_collection.json \
            -e ServeRest-Environment.postman_environment.json \
            --delay-request 600 \
            --reporters cli,htmlextra \
            --reporter-htmlextra-export reports/test-report.html \
            --reporter-htmlextra-title "ServeRest API Test Report" \
            --reporter-htmlextra-browserTitle "API Tests"
        continue-on-error: false

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-report
          path: reports/
          retention-days: 30

      - name: Upload Newman Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-test-details
          path: reports/
          retention-days: 7
